<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas Claras – Ingreso al sistema</title>
  <meta name="description" content="Acceso al prototipo de gestión contable digital para microempresas comerciales de Trinidad, Beni, Bolivia.">

  <!-- Bootstrap 5 por CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons por CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Estilos propios -->
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body data-page="login" data-auth="false">

  <div class="cc-login-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
          <div class="card cc-login-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

              <div class="text-center mb-4">
                <div class="cc-brand-mark mx-auto mb-3">
                  <i class="bi bi-journal-check"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Cuentas Claras</h1>
                <p class="text-muted small mb-0">
                  Gestión contable digital para microempresas
                </p>
              </div>

              <div
                id="loginMessage"
                class="alert alert-info d-none"
                role="alert"
              ></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="loginUser" class="form-label">
                    Usuario
                  </label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control"
                      id="loginUser"
                      name="loginUser"
                      placeholder="admin"
                      autocomplete="username"
                      required
                    >
                  </div>
                </div>

                <div class="mb-3">
                  <label for="loginPassword" class="form-label">
                    Contraseña
                  </label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-lock"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control"
                      id="loginPassword"
                      name="loginPassword"
                      placeholder="••••••••"
                      autocomplete="current-password"
                      required
                    >
                  </div>
                </div>

                <div class="d-grid gap-2 mb-3">
                  <button type="submit" class="btn btn-primary cc-btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Ingresar
                  </button>

                  <button
                    type="button"
                    id="btnLoadDemo"
                    class="btn btn-outline-secondary"
                  >
                    <i class="bi bi-database-add me-1"></i>
                    Cargar datos de demostración
                  </button>
                </div>
              </form>

              <div class="alert alert-light border small mb-3">
                <p class="fw-semibold mb-1">
                  Credenciales de demostración
                </p>
                <ul class="mb-2 ps-3">
                  <li><code>admin</code> / <code>Admin123</code></li>
                  <li><code>contador</code> / <code>Contador123</code></li>
                </ul>
                <p class="mb-0 text-muted">
                  Estas credenciales son para prototipo académico.
                </p>
              </div>

              <div class="text-center">
                <a href="./index.html" class="small text-decoration-none">
                  <i class="bi bi-arrow-left me-1"></i>
                  Volver a la presentación
                </a>
              </div>

            </div>
          </div>

          <div class="text-center mt-3">
            <p class="small text-muted mb-0">
              Trinidad – Beni – Bolivia · 2026
            </p>
            <p class="small text-muted">
              Prototipo académico de Contabilidad.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <div class="container my-5">
      <div class="alert alert-warning">
        Este prototipo necesita JavaScript habilitado para funcionar.
      </div>
    </div>
  </noscript>

  <!-- Bootstrap Bundle con Popper -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    defer
  ></script>

  <!-- Scripts del proyecto -->
  <script src="./js/config.js" defer></script>
  <script src="./js/utils.js" defer></script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/data/seed.js" defer></script>
  <script src="./js/modules/bitacora.js" defer></script>
  <script src="./js/auth.js" defer></script>
  <script src="./js/layout.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
